<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 1678x2532 = 卡正面 UV 区域(839x1266)的 2 倍，atlas 合成 scale=2 后 1:1 像素映射，零缩放零裁剪 */
  /* 高度预算：top 223 + photo 96+1380 + identity 448 + info 318 ≈ 2369，footer 吸底，余量 ~29px */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1678px; height: 2532px; }
  body {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(145deg, rgba(52,211,153,0.11), transparent 30%),
      #f7f8f7;
    color: #101010;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(to right, rgba(0,0,0,0.035) 0 1px, transparent 1px 108px),
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.035) 0 1px, transparent 1px 108px);
    pointer-events: none;
  }
  .accent {
    position: absolute;
    top: 0;
    right: 0;
    width: 440px;
    height: 280px;
    background: linear-gradient(135deg, #34d399 0 52%, #111 52%);
    clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 0);
  }
  .top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 88px 112px 0;
  }
  .brand { display: flex; align-items: baseline; gap: 34px; }
  .brand .mark {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 104px;
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: 2px;
  }
  .brand .meta {
    color: #555;
    font-family: Consolas, "Courier New", monospace;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 8px;
  }
  .photo-shell {
    position: relative;
    z-index: 1;
    /* 内框 880x1140 与照片 612x792 同比例(0.773)，cover 零裁剪 */
    width: 952px;
    height: 1212px;
    margin: 96px auto 0;
    padding: 28px;
    border: 8px solid #111;
    background: #fff;
    box-shadow: 38px 38px 0 rgba(52, 211, 153, 0.16), -38px -38px 0 rgba(17, 17, 17, 0.08);
  }
  .photo-shell::before,
  .photo-shell::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 20px;
    background: #111;
  }
  .photo-shell::before { top: -14px; left: 70px; }
  .photo-shell::after { bottom: -14px; right: 70px; }
  .photo {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f6f7f9;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .identity {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-top: 48px;
  }
  .identity .cn {
    font-size: 172px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 40px;
    text-indent: 40px;
  }
  .identity .en {
    margin-top: 30px;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 26px;
  }
  .role {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    margin-top: 44px;
    padding: 22px 40px;
    background: #111;
    color: #fff;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 7px;
  }
  .role i { width: 28px; height: 28px; background: #34d399; display: block; }
  .info {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px 96px;
    margin: 44px 112px 0;
    padding-top: 32px;
    border-top: 6px solid #111;
  }
  .item { text-align: center; }
  .item .k {
    color: #777;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 7px;
    line-height: 1.2;
  }
  .item .v {
    margin-top: 18px;
    font-size: 44px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .bottom {
    position: relative;
    z-index: 1;
    margin-top: auto;
    height: 134px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 112px;
    background: #111;
    color: #fff;
  }
  .bottom .badge {
    display: flex;
    align-items: baseline;
    gap: 28px;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 10px;
  }
  .bottom .badge em {
    font-style: normal;
    color: rgba(255,255,255,0.55);
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 26px;
    letter-spacing: 6px;
  }
  .bottom .code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.85);
  }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="top">
    <div class="brand">
      <span class="mark">YL.</span>
      <span class="meta">PORTFOLIO ID</span>
    </div>
  </div>

  <div class="photo-shell">
    <div class="photo"><img src="photo.png" alt="李怡霖证件照"></div>
  </div>

  <section class="identity">
    <div class="cn">李怡霖</div>
    <div class="en">YILING LI</div>
    <div class="role"><i></i>AI 应用与全栈开发<i></i></div>
  </section>

  <section class="info">
    <div class="item"><div class="k">方向 FOCUS</div><div class="v">AI APPLICATIONS</div></div>
    <div class="item"><div class="k">身份 PROFILE</div><div class="v">PORTFOLIO</div></div>
    <div class="item"><div class="k">技术 BUILD</div><div class="v">FULL-STACK</div></div>
    <div class="item"><div class="k">状态 STATUS</div><div class="v">OPEN TO WORK</div></div>
  </section>

  <footer class="bottom">
    <div class="badge">个人作品集<em>PORTFOLIO PASS</em></div>
    <div class="code">YL&lt;&lt;FULLSTACK</div>
  </footer>
</body>
</html>
