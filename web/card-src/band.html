<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* 1025x250，meshline 沿绳长 repeat 平铺；个人作品集黑白绿识别系统 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1025px; height: 250px; }
  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;
    overflow: hidden;
    font-family: "Arial Black", "Segoe UI", sans-serif;
  }
  strong {
    display: grid;
    width: 138px;
    height: 138px;
    place-items: center;
    background: #34d399;
    color: #07110d;
    font-size: 72px;
    line-height: 1;
  }
  span {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <strong>YL</strong>
  <span>YILING LI / PORTFOLIO</span>
</body>
</html>
